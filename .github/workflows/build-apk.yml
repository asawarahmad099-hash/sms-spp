name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Puts sdkmanager on PATH and accepts SDK licenses — flutter-action
      # (below) only installs the Flutter SDK itself, not Android SDK
      # command-line tools, so sdkmanager isn't reliably on PATH without this.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pre-install the exact NDK version this Flutter release's Gradle
      # plugin defaults to (ndkVersion = flutter.ndkVersion in
      # android/app/build.gradle.kts). Without this, Gradle's own
      # auto-install of a missing NDK package can fail with just "Package
      # ndk not found" and no clearer reason.
      - name: Install required Android NDK
        run: sdkmanager --install "ndk;28.2.13676358"

      # Pinned to match the project's currently-verified Flutter version
      # (analyze/test/build all confirmed locally against this exact
      # version) rather than a moving "stable" channel, so this workflow
      # doesn't silently break on an unrelated Flutter release bump.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-gateway-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
